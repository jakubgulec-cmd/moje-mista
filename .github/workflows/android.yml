name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Podpisový klíč
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > android/release.keystore

      - name: Sestavení APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}0
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Vydání na GitHubu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk moje-mista.apk
          gh release create "android-app-${{ github.run_number }}" moje-mista.apk \
            --title "Moje místa – Android aplikace (${{ github.run_number }})" \
            --notes "Nativní Android aplikace. Na telefonu stáhni moje-mista.apk, otevři ho a povol instalaci. Sdílení z Instagramu: Sdílet → Moje místa." \
            --latest
