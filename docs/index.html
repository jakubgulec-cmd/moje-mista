<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Moje místa</title>
  <meta name="theme-color" content="#f4f5fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d17" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Moje místa">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
        integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map" aria-label="Mapa míst"></div>

  <header class="topbar">
    <div class="brand glass">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 22s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12Z"/><circle cx="12" cy="10" r="2.6"/></svg>
      </div>
      <div class="brand-text">
        <div class="brand-title">Moje místa</div>
        <div id="brand-sub" class="brand-sub">Načítám…</div>
      </div>
    </div>
    <div id="chips" class="chips" role="toolbar" aria-label="Filtr podle typu"></div>
  </header>

  <nav class="dock glass" aria-label="Akce">
    <button id="btn-locate" class="dock-btn" aria-label="Moje poloha">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg>
      <span>Poloha</span>
    </button>
    <button id="btn-list" class="dock-btn" aria-label="Seznam míst">
      <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.2"/><circle cx="3.5" cy="12" r="1.2"/><circle cx="3.5" cy="18" r="1.2"/></svg>
      <span>Seznam</span>
    </button>
    <button id="btn-recommend" class="dock-main" aria-label="Doporuč mi místo">
      <svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3Z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15Z"/></svg>
    </button>
    <button id="btn-add" class="dock-btn" aria-label="Přidat místo">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span>Přidat</span>
    </button>
    <a class="dock-btn" href="https://t.me/mapinstabot" target="_blank" rel="noopener" aria-label="Telegram bot">
      <svg viewBox="0 0 24 24"><path d="M21.5 4.5 2.8 11.7c-.9.4-.9 1.6.1 1.9l4.6 1.4 1.8 5.6c.3.8 1.3 1 1.9.4l2.6-2.5 4.7 3.4c.7.5 1.7.1 1.9-.7L23 5.9c.2-1-.6-1.8-1.5-1.4Z"/><path d="m7.5 15 9.5-6.5"/></svg>
      <span>Bot</span>
    </a>
  </nav>

  <div id="empty" class="empty glass-strong" hidden>
    <div class="empty-orb">✨</div>
    <h2>Tvoje mapa je zatím prázdná</h2>
    <p>Sdílej reelsko z Instagramu do Telegram bota a místo se tu objeví samo.</p>
    <div class="empty-actions">
      <a class="btn btn-primary" href="https://t.me/mapinstabot" target="_blank" rel="noopener">Otevřít bota</a>
      <button id="empty-add" class="btn btn-glass">Přidat ručně</button>
    </div>
  </div>

  <div id="banner" class="banner glass-strong" hidden></div>

  <div id="backdrop" class="backdrop" hidden></div>
  <section id="sheet" class="sheet glass-strong" hidden aria-modal="true" role="dialog">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button id="sheet-close" class="round-btn" aria-label="Zavřít">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </section>

  <div id="toast" class="toast glass-strong" role="status" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"
          integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin=""></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"
          integrity="sha384-tXYNKOHx4T02jMP7YYCtBxPIv1B5gaA5mcVPBzqMp6d7VzWzxJgI2aWF/nJLrQdS" crossorigin=""></script>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
