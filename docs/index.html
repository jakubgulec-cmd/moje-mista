<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Moje místa</title>
  <meta name="theme-color" content="#1d3557">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Moje místa">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map" aria-label="Mapa míst"></div>

  <header class="topbar">
    <div id="chips" class="chips" role="toolbar" aria-label="Filtr podle typu"></div>
  </header>

  <div class="fabs">
    <button id="btn-locate" class="fab" aria-label="Moje poloha" title="Moje poloha">◎</button>
    <button id="btn-list" class="fab" aria-label="Seznam míst" title="Seznam">☰</button>
    <button id="btn-recommend" class="fab fab-accent" aria-label="Doporuč mi místo" title="Doporuč mi">✨</button>
    <button id="btn-add" class="fab fab-primary" aria-label="Přidat místo" title="Přidat">＋</button>
  </div>

  <div id="banner" class="banner" hidden></div>

  <div id="backdrop" class="backdrop" hidden></div>
  <section id="sheet" class="sheet" hidden aria-modal="true" role="dialog">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button id="sheet-close" class="icon-btn" aria-label="Zavřít">✕</button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </section>

  <div id="toast" class="toast" role="status" hidden></div>

  <div id="gate" class="gate" hidden>
    <div class="gate-card">
      <div class="gate-logo">📍</div>
      <h1>Moje místa</h1>
      <p>Otevři aplikaci odkazem z Telegram bota (příkaz <b>/start</b> nebo <b>/mapa</b>).</p>
      <p class="muted">Na iPhonu po přidání na plochu vlož přístupový klíč (příkaz <b>/klic</b>):</p>
      <form id="gate-form">
        <input id="gate-key" type="password" autocomplete="off" placeholder="Přístupový klíč" required>
        <button class="btn btn-primary" type="submit">Pokračovat</button>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
