<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Moje místa – mapa míst z reels</title>
  <meta name="description" content="Společná mapa míst z cestovatelských Instagram reels.">
  <meta name="theme-color" content="#eef1f6">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Moje místa">
  <link rel="manifest" href="manifest.webmanifest?v=202611051539">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
        integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="">
  <link rel="stylesheet" href="styles.css?v=202611051539">
</head>
<body>

  <div id="map" aria-label="Mapa míst"></div>

  <header class="topbar">
    <div class="bar">
      <div id="viewswitch" class="viewswitch lg lens" role="tablist" aria-label="Zobrazení mapy">
        <span class="vs-thumb" aria-hidden="true"></span>
        <button id="view-community" class="vs-btn on" role="tab" aria-selected="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.6 3.6 5.4 3.6 8.5s-1.2 5.9-3.6 8.5c-2.4-2.6-3.6-5.4-3.6-8.5s1.2-5.9 3.6-8.5Z"/></svg>
          <span><b>Komunita</b><small id="cnt-community">…</small></span>
        </button>
        <button id="view-mine" class="vs-btn" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9L12 3.5Z"/></svg>
          <span><b>Moje mapa</b><small id="cnt-mine">přihlas se</small></span>
        </button>
      </div>
      <button id="btn-radius" class="lg lens pill-btn" aria-label="Vzdálenost">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/></svg>
        <span id="radius-label">Všude</span>
      </button>
    </div>
    <div id="chips" class="chips" role="toolbar" aria-label="Filtr podle typu"></div>
  </header>

  <nav class="dock lg lens" aria-label="Akce">
    <button id="btn-locate" class="dock-btn" aria-label="Moje poloha">
      <svg viewBox="0 0 24 24"><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2.2"/></svg>
      <span>Poloha</span>
    </button>
    <button id="btn-list" class="dock-btn" aria-label="Seznam míst">
      <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.1"/><circle cx="4.5" cy="12" r="1.1"/><circle cx="4.5" cy="18" r="1.1"/></svg>
      <span>Seznam</span>
    </button>
    <button id="btn-add" class="dock-main lg tint" aria-label="Přidat reelsko">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button id="btn-recommend" class="dock-btn" aria-label="Tipy na místa">
      <svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.9L19 9.7l-5.2 1.8L12 16.5l-1.8-5L5 9.7l5.2-1.8L12 3Z"/><path d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7.7-1.8Z"/></svg>
      <span>Tipy</span>
    </button>
    <button id="btn-account" class="dock-btn" aria-label="Účet">
      <span id="avatar" class="avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.4-3.6 4.2-5.4 7.5-5.4s6.1 1.8 7.5 5.4"/></svg></span>
      <span id="account-label">Účet</span>
    </button>
  </nav>

  <div id="backdrop" class="backdrop" hidden></div>
  <section id="sheet" class="sheet" hidden aria-modal="true" role="dialog">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <button id="sheet-back" class="lg round-btn" aria-label="Zpět" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 5.5 8.5 12l6.5 6.5"/></svg>
      </button>
      <h2 id="sheet-title"></h2>
      <button id="sheet-close" class="lg round-btn" aria-label="Zavřít">
        <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </section>

  <div id="toast" class="toast lg lens" role="status" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
          integrity="sha384-eXVCORTRlv4FUUgS/xmOyr66XBVraen8ATNLMESp92FKXLAMiKkerixTiBvXriZr" crossorigin=""></script>
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"
          integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin=""></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"
          integrity="sha384-tXYNKOHx4T02jMP7YYCtBxPIv1B5gaA5mcVPBzqMp6d7VzWzxJgI2aWF/nJLrQdS" crossorigin=""></script>
  <script src="config.js?v=202611051539"></script>
  <script type="module" src="app.js?v=202611051539"></script>
</body>
</html>
